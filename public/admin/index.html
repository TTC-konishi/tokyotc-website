<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, nofollow">
    <meta http-equiv="Cache-Control" content="no-store">
    <link rel="icon" href="/favicon.svg">
    <title>TTC ホームページ編集</title>
    <style>
      :root {
        color: #25332f;
        background: #f6f4ed;
        font-family: "Hiragino Sans", "Yu Gothic", sans-serif;
      }

      * { box-sizing: border-box; }
      body { margin: 0; }
      button, input, textarea { font: inherit; }

      .local-editor { display: none; min-height: 100vh; background: #f6f4ed; }
      .local-editor.is-visible { display: block; }

      .editor-header {
        position: sticky;
        z-index: 10;
        top: 0;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 20px;
        padding: 16px max(20px, calc((100vw - 1040px) / 2));
        border-bottom: 1px solid #deddd5;
        background: rgba(255, 255, 255, 0.94);
        backdrop-filter: blur(12px);
      }

      .editor-header img { width: min(250px, 52vw); }
      .editor-header a { color: #245e50; font-size: 14px; font-weight: 800; text-underline-offset: 4px; }

      .editor-shell { width: min(960px, calc(100% - 40px)); margin: 0 auto; padding: 48px 0 120px; }

      .editor-intro {
        padding: clamp(28px, 6vw, 54px);
        border: 1px solid rgba(36, 94, 80, 0.14);
        border-radius: 26px;
        background: #fff;
        box-shadow: 0 20px 60px rgba(50, 55, 43, 0.08);
      }

      .eyebrow { margin: 0 0 10px; color: #9a6b20; font-size: 13px; font-weight: 900; letter-spacing: 0.12em; }
      h1 { margin: 0; font-size: clamp(30px, 6vw, 50px); line-height: 1.25; }
      .editor-intro > p:last-of-type { margin: 18px 0 0; color: #5a6762; line-height: 1.8; }

      .trial-note {
        margin-top: 24px;
        padding: 18px 20px;
        border-radius: 14px;
        background: #eef5f1;
        color: #245e50;
        font-weight: 700;
        line-height: 1.7;
      }

      .editor-section {
        margin-top: 24px;
        padding: clamp(24px, 5vw, 38px);
        border: 1px solid #e1dfd6;
        border-radius: 22px;
        background: #fff;
      }

      .section-heading { margin: 0 0 22px; font-size: 24px; }

      .field { display: grid; gap: 8px; margin-top: 20px; }
      .field:first-of-type { margin-top: 0; }
      .field span { font-weight: 800; }
      .field small { color: #69746f; line-height: 1.6; }

      .field input[type="text"], .field textarea {
        width: 100%;
        border: 1px solid #cfd7d3;
        border-radius: 12px;
        background: #fff;
        color: #25332f;
        outline: none;
      }

      .field input[type="text"] { min-height: 48px; padding: 0 14px; }
      .field textarea { min-height: 118px; padding: 12px 14px; line-height: 1.7; resize: vertical; }
      .field input:focus, .field textarea:focus { border-color: #245e50; box-shadow: 0 0 0 3px rgba(36, 94, 80, 0.12); }

      .reasons-editor { display: grid; gap: 18px; }

      .reason-editor {
        padding: 24px;
        border: 1px solid #e2e3dc;
        border-radius: 18px;
        background: #fbfbf8;
      }

      .reason-editor h3 { margin: 0; color: #245e50; font-size: 19px; }

      .image-row {
        display: grid;
        grid-template-columns: 180px 1fr;
        gap: 18px;
        align-items: center;
        margin-top: 20px;
      }

      .image-row img { width: 180px; height: 124px; border-radius: 12px; object-fit: cover; background: #e8ecea; }
      .image-row input { max-width: 100%; }

      .editor-actions {
        display: flex;
        flex-wrap: wrap;
        gap: 12px;
        align-items: center;
        margin-top: 26px;
        padding: 22px;
        border-radius: 18px;
        background: #253f37;
      }

      .action-button {
        min-height: 50px;
        padding: 0 22px;
        border: 0;
        border-radius: 999px;
        background: #dcb568;
        color: #2c291f;
        cursor: pointer;
        font-weight: 900;
      }

      .action-button.secondary { border: 1px solid rgba(255, 255, 255, 0.35); background: transparent; color: #fff; }
      .action-button.ghost { margin-left: auto; background: transparent; color: rgba(255, 255, 255, 0.78); }
      .save-status { flex-basis: 100%; margin: 2px 4px 0; color: #fff; font-size: 14px; line-height: 1.6; }
      .save-status.is-error { color: #ffd3ce; }

      @media (max-width: 640px) {
        .editor-header { align-items: flex-start; }
        .editor-header img { width: 200px; }
        .image-row { grid-template-columns: 1fr; }
        .image-row img { width: 100%; height: 180px; }
        .action-button { width: 100%; }
        .action-button.ghost { margin-left: 0; }
      }
    </style>
  </head>
  <body>
    <div class="local-editor" id="local-editor">
      <header class="editor-header">
        <img src="/logo-horizontal.png" alt="東京トータルコンサルティング">
        <a href="/staff/index.html">案内画面へ戻る</a>
      </header>

      <main class="editor-shell">
        <section class="editor-intro">
          <p class="eyebrow">LOCAL TRIAL EDITOR</p>
          <h1>「選ばれる理由」を編集</h1>
          <p>文章や写真を変更して下書きを保存し、確認ページで仕上がりを確認できます。</p>
          <div class="trial-note">これは試作版です。変更内容はこのパソコンだけに保存され、本番サイトには公開されません。</div>
        </section>

        <form id="feature-editor-form">
          <section class="editor-section">
            <h2 class="section-heading">ページ上部</h2>
            <label class="field">
              <span>ページの見出し</span>
              <input id="page-title" type="text" required>
            </label>
            <label class="field">
              <span>はじめの説明文</span>
              <textarea id="page-lead" required></textarea>
            </label>
          </section>

          <section class="editor-section">
            <h2 class="section-heading">3つの選ばれる理由</h2>
            <div class="reasons-editor" id="reasons-editor"></div>
          </section>

          <div class="editor-actions">
            <button class="action-button" type="submit">下書きを保存</button>
            <button class="action-button secondary" id="open-preview" type="button">確認ページを開く</button>
            <button class="action-button ghost" id="reset-draft" type="button">元の内容に戻す</button>
            <p class="save-status" id="save-status" aria-live="polite">編集する項目を選んでください。</p>
          </div>
        </form>
      </main>
    </div>

    <noscript>ホームページ編集画面を開くにはJavaScriptを有効にしてください。</noscript>
    <script>
      const isLocalPreview = ["localhost", "127.0.0.1"].includes(window.location.hostname);

      function loadScript(src) {
        return new Promise((resolve, reject) => {
          const script = document.createElement("script");
          script.src = src;
          script.onload = resolve;
          script.onerror = reject;
          document.body.appendChild(script);
        });
      }

      if (isLocalPreview) {
        document.getElementById("local-editor").classList.add("is-visible");
        loadScript("/admin/local-editor.js");
      } else {
        loadScript("https://identity.netlify.com/v1/netlify-identity-widget.js")
          .then(() => loadScript("https://unpkg.com/decap-cms@3.15.1/dist/decap-cms.js"));
      }
    </script>
  </body>
</html>
